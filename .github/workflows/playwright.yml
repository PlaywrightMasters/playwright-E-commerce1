name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5' # weekdays at 06:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # These projects need no browser download.
      - run: npx playwright test --project=unit --project=api

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: report-unit-api
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e:
    name: E2E (${{ matrix.name }})
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium
            browsers: chromium
            projects: --project=chromium --project=accessibility
          - name: firefox
            browsers: firefox
            projects: --project=firefox
          - name: webkit
            browsers: webkit
            projects: --project=webkit
          - name: mobile
            browsers: chromium webkit
            projects: --project=mobile-chrome --project=mobile-safari
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
      - run: npx playwright test ${{ matrix.projects }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
